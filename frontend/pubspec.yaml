name: frontend
description: "A new Flutter project for B2B Issue Tracking"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.2.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  lucide_flutter: ^1.7.0
  shimmer: ^3.0.0
  intl: any
  flutter_html: ^3.0.0-beta.2
  flutter_quill: ^9.3.0
  vsc_quill_delta_to_html: any
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  intl: any

flutter:
  uses-material-design: true
